<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Cadastro - CheckAi</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .header { background: white; width: 100%; max-width: 600px; padding: 20px; border-radius: 10px; border-left: 5px solid #0052cc; margin-bottom: 20px; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h2, h3 { margin-top: 0; color: #333; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        .btn-blue { background: #2962ff; color: white; border: none; padding: 15px; width: 100%; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-gray { background: #607d8b; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <h2>Painel de Cadastro</h2>
        <p>Desenvolvedor: Rodrigo</p>
    </div>

    <div class="card">
        <h3>Cadastrar Novo Usuário</h3>
        <input type="text" id="nome" placeholder="Nome Completo">
        <input type="text" id="empresa" placeholder="Empresa">
        <input type="email" id="email" placeholder="E-mail / Login">
        <input type="password" id="senha" placeholder="Senha (mínimo 6 dígitos)">
        
        <label>Nível de Acesso:</label>
        <select id="tipo">
            <option value="colaborador">Colaborador</option>
            <option value="gestor">Gestor</option>
            <option value="admin">Administrador</option>
        </select>

        <button class="btn-blue" id="btnCadastrar">CADASTRAR USUÁRIO</button>
        <button class="btn-gray" onclick="window.location.href='index.html'">Voltar ao Login</button>
    </div>
