<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CheckAi</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #2c3e50; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 350px; text-align: center; }
        .logo-area h2 { color: #3498db; margin: 10px 0; font-size: 28px; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; margin-bottom: 15px; }
        button { width: 100%; padding: 15px; background: #3498db; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="login-card">
    <div class="logo-area"><h2><i class="fas fa-check-circle"></i> CheckAi</h2></div>
    <input type="text" id="loginEmail" placeholder="Usuário ou E-mail">
    <input type="password" id="loginSenha" placeholder="Senha">
    <button id="btnEntrar">ENTRAR</button>
</div>

<script type="module">
    // Importando Firebase
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBkVb8zenJDjsPSFRCiEmcsOHYhKdquT7M",
        authDomain: "check-ai-9303f.firebaseapp.com",
        projectId: "check-ai-9303f",
        storageBucket: "check-ai-9303f.firebasestorage.app",
        messagingSenderId: "732538707024",
        appId: "1:732538707024:web:d467b1246c7dcb16030555"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function realizarLogin() {
        const user = document.getElementById('loginEmail').value;
        const pass = document.getElementById('loginSenha').value;

        // --- REGRA 1: LOGIN MASTER (Sempre funciona primeiro) ---
        if (user === "vidalborges" && pass === "Vid@!214161") {
            localStorage.setItem('usuarioLogado', 'Rodrigo Vidal');
            localStorage.setItem('userType', 'admin');
            window.location.href = "admin.html";
            return;
        }

        // --- REGRA 2: BUSCA NO FIREBASE ---
        try {
            const q = query(collection(db, "usuarios"), where("login", "==", user), where("senha", "==", pass));
            const querySnapshot = await getDocs(q);

            if (!querySnapshot.empty) {
                const dados = querySnapshot.docs[0].data();
                localStorage.setItem('usuarioLogado', dados.nome);
                localStorage.setItem('userType', dados.tipo);
                window.location.href = dados.tipo + ".html";
            } else {
                alert("Usuário ou senha incorretos.");
            }
        } catch (e) {
            console.error(e);
            alert("Erro de conexão. O Login Master ainda deve funcionar.");
        }
    }

    // Vincula a função ao botão
    document.getElementById('btnEntrar').addEventListener('click', realizarLogin);
</script>
</body>
</html>
